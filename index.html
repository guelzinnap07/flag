<html lang="pt-BR">

<title>Chroma Flag · Descubra a bandeira secreta</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#f4f1ff;--bg2:#dff1ff;--card:#ffffffcc;--tx:#1d1a33;--mut:#6a6786;--bd:#1d1a3322;--ac:#6d4aff;--ac2:#ff4d8d;--ok:#12a150;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg1:#150f33;--bg2:#0a2540;--card:#1c1640cc;--tx:#f2f0ff;--mut:#a9a6c9;--bd:#ffffff22;--ok:#3ddc84}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:400 16px/1.4 Outfit,system-ui,sans-serif;color:var(--tx);background:linear-gradient(140deg,var(--bg1),var(--bg2)) fixed;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:340px;height:340px;border-radius:50%;filter:blur(70px);opacity:.45;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
body::before{background:var(--ac);top:-90px;left:-90px}
body::after{background:var(--ac2);bottom:-90px;right:-90px;animation-delay:-7s}
@keyframes fl{to{transform:translate(60px,50px) scale(1.2)}}
main{max-width:520px;margin:0 auto;padding:22px 16px 40px}
h1{margin:0;text-align:center;font-weight:800;font-size:clamp(30px,9vw,44px);letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2),#ffb02e);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--mut);margin:6px 0 18px}
.card{background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:26px;padding:18px;box-shadow:0 20px 60px #0003}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--mut);font-weight:600;font-size:14px}
#dots i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;background:var(--bd);transition:.3s}
#dots i.u{background:var(--ac2)}
.flag{position:relative;aspect-ratio:3/2;border-radius:16px;overflow:hidden;background:repeating-linear-gradient(45deg,#00000014 0 10px,#0000000a 10px 20px),var(--bd);box-shadow:0 10px 30px #0003,inset 0 0 0 1px var(--bd)}
.flag svg{position:absolute;inset:0;width:100%;height:100%}
.q{position:absolute;inset:0;display:grid;place-items:center;font-size:72px;font-weight:800;color:var(--mut);opacity:.5}
.flag::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,#fff0 30%,#ffffff40 48%,#fff0 66%);background-size:250% 100%;animation:sh 4s infinite;pointer-events:none}
@keyframes sh{from{background-position:120% 0}to{background-position:-120% 0}}
.pop{animation:pop .7s both}
@keyframes pop{from{opacity:0;filter:brightness(3)}to{opacity:1;filter:none}}
.chips{display:flex;gap:8px;justify-content:center;margin:14px 0;align-items:center;color:var(--mut);font-size:13px;font-weight:600}
.chips b{width:24px;height:24px;border-radius:50%;border:2px dashed var(--mut);display:grid;place-items:center;font-size:12px}
.chips b.on{border:2px solid #fff;box-shadow:0 0 0 1px var(--bd),0 3px 8px #0004}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:13px 15px;border-radius:14px;border:1.5px solid var(--bd);background:var(--bg1);color:var(--tx);outline:0}
input:focus{border-color:var(--ac);box-shadow:0 0 0 4px #6d4aff33}
.inw{position:relative;flex:1;min-width:0}
.inw input{width:100%;padding-left:62px;font-weight:600}
#pf{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:38px;height:25px;border-radius:5px;border:1.5px dashed var(--mut);overflow:hidden;display:grid;place-items:center;pointer-events:none}
#pf:empty::before{content:"?";color:var(--mut);font-weight:800;font-size:13px}
#pf.on{border:0;box-shadow:0 0 0 1px var(--bd),0 3px 8px #0003;animation:pop .35s both}
#pf svg{width:100%;height:100%;display:block}
#sug{display:none;position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:20;background:var(--bg1);border:1px solid var(--bd);border-radius:18px;padding:6px;box-shadow:0 18px 40px #0006;max-height:290px;overflow:auto}
.o{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;cursor:pointer;font-weight:600;transition:background .12s}
.o svg{width:44px;height:29px;border-radius:5px;flex:none;box-shadow:0 0 0 1px var(--bd),0 2px 6px #0003}
.o.h{background:linear-gradient(90deg,#6d4aff33,#ff4d8d33)}
mark{background:none;color:var(--ac2);font-weight:800}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:0 20px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));cursor:pointer;transition:transform .15s}
button:active{transform:scale(.95)}
#msg{min-height:24px;margin:12px 0 4px;text-align:center;font-weight:600}
#msg.bad{animation:sk .4s}
#msg.win{color:var(--ok);font-size:19px}
@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;background:var(--bg1);border:1px solid var(--bd);animation:pop .4s both}
li svg{width:48px;height:32px;border-radius:5px;flex:none;box-shadow:0 0 0 1px var(--bd)}
li div{flex:1;min-width:0}
li small{display:block;color:var(--mut);font-size:12px}
.d{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px;vertical-align:-1px;box-shadow:0 0 0 1px var(--bd)}
.x{color:var(--ac2);font-weight:800}
.ok{color:var(--ok);font-weight:800}
</style>
</head>

const AL={eua:'estados unidos',holanda:'paises baixos',inglaterra:'reino unido',tchequia:'republica tcheca',eau:'emirados arabes unidos',belarus:'bielorrussia',birmania:'myanmar',swazilandia:'eswatini',macedonia:'macedonia do norte','timor leste':'timor-leste','guine bissau':'guine-bissau'};
const MAX=8;
const $=id=>document.getElementById(id);
const nm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const svg=(f,rv,fr)=>`<svg viewBox="0 0 30 20">${f.map(([c,s],i)=>!rv||rv.has(c)?`<g fill="${PAL[c]}" color="${PAL[c]}" stroke="none"${fr&&fr.has(c)?` class="pop" style="animation-delay:${i*60}ms"`:''}>${s}</g>`:'').join('')}</svg>`;
const cols=f=>[...new Set(f[1].map(s=>s[0]))];
let sec,gs,rev,over;
function say(t,c){const m=$('msg');m.className='';void m.offsetWidth;m.className=c||'';m.textContent=t}
function render(fr){
  $('dots').innerHTML=[...Array(MAX)].map((_,i)=>`<i class="${i<gs.length?'u':''}"></i>`).join('');
  const cs=cols(sec);
  $('cnt').textContent=`${cs.length} cores na bandeira`;
  $('flag').innerHTML=(rev.size?'':'<div class="q">?</div>')+svg(sec[1],rev,fr);
  $('chips').innerHTML='Cores:'+cs.map(c=>rev.has(c)?`<b class="on" style="background:${PAL[c]}"></b>`:'<b>?</b>').join('');
  $('hist').innerHTML=gs.slice().reverse().map(g=>`<li>${svg(g.f[1])}<div><b>${g.f[0]}</b><small>${g.com.length?'Cores em comum: '+g.com.map(c=>`<i class="d" style="background:${PAL[c]}"></i>`).join(''):'Nenhuma cor em comum'}</small></div><span class="${g.f===sec?'ok':'x'}">${g.f===sec?'✓':'✗'}</span></li>`).join('');
  $('in').disabled=over;
  $('go').textContent=over?'Jogar de novo':'Chutar';
}
function start(){
  sec=F[Math.random()*F.length|0];gs=[];rev=new Set();over=false;
  $('in').value='';sg();render();
  say(`Qual país é essa bandeira? Você tem ${MAX} tentativas.`);
}
function guess(){
  if(over)return start();
  let k=nm($('in').value);k=AL[k]||k;
  const f=F.find(x=>nm(x[0])===k);
  if(!f)return say('País não encontrado. Escolha um da lista!','bad');
  if(gs.some(g=>g.f===f))return say('Você já tentou esse país.','bad');
  const sc=cols(sec),com=cols(f).filter(c=>sc.includes(c)),fr=new Set();
  com.forEach(c=>{if(!rev.has(c))fr.add(c);rev.add(c)});
  gs.push({f,com});$('in').value='';sg();
  if(f===sec){over=true;sc.forEach(c=>{if(!rev.has(c))fr.add(c);rev.add(c)});render(fr);return say(`🎉 Acertou em ${gs.length} ${gs.length>1?'tentativas':'tentativa'}! É ${sec[0]}.`,'win')}
  if(gs.length>=MAX){over=true;sc.forEach(c=>{if(!rev.has(c))fr.add(c);rev.add(c)});render(fr);return say(`Fim de jogo! A bandeira era ${sec[0]}.`,'bad')}
  render(fr);
  say(com.length?`Errou! ${com.length>1?com.length+' cores reveladas':'1 cor revelada'} 🎨`:'Errou! Nenhuma cor em comum.','bad');
  $('in').focus();
}
let cur=[],sel=0,exm=null,qq='';
const hl=(n,q)=>{const i=q?nm(n).indexOf(q):-1;return i<0?n:n.slice(0,i)+'<mark>'+n.slice(i,i+q.length)+'</mark>'+n.slice(i+q.length)};
function dr(){const u=$('sug');u.innerHTML=cur.map((f,i)=>`<div class="o${i===sel?' h':''}" data-i="${i}">${svg(f[1])}<span>${hl(f[0],qq)}</span></div>`).join('');u.style.display=cur.length?'block':'none';if(cur.length)u.scrollIntoView({block:'nearest'})}
function sg(){
  let q=nm($('in').value);q=AL[q]||q;qq=q;
  exm=F.find(f=>nm(f[0])===q)||null;
  $('pf').innerHTML=exm?svg(exm[1]):'';$('pf').className=exm?'on':'';
  cur=q&&!over?F.filter(f=>nm(f[0]).includes(q)&&!gs.some(g=>g.f===f)).sort((a,b)=>nm(b[0]).startsWith(q)-nm(a[0]).startsWith(q)||a[0].localeCompare(b[0],'pt')).slice(0,6):[];
  if(exm&&cur.length===1)cur=[];
  sel=0;dr();
}
const pick=i=>{$('in').value=cur[i][0];sg();$('in').focus()};
$('go').onclick=guess;
$('in').oninput=sg;$('in').onfocus=sg;$('in').onblur=()=>{$('sug').style.display='none'};
$('sug').onpointerdown=e=>{e.preventDefault();const o=e.target.closest('.o');if(o)pick(+o.dataset.i)};
$('in').onkeydown=e=>{
  const n=cur.length;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(n){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:n-1))%n;dr()}}
  else if(e.key==='Escape'){cur=[];dr()}
  else if(e.key==='Enter'){e.preventDefault();n&&!exm?pick(sel):guess()}
};
